<script>
(function (w, d) {
  'use strict';
  var WC = w.WINGCHUN, L = WC.LIST, S = w.KTFigure.S;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };

  function feetSVG(s, side, lang) {   // top view of the Wing Chun stance: toes in
    var cx = 130, cy = 100, out = '';
    out += S.line({ x: cx, y: 16 }, { x: cx, y: 178 }, '#D92D20', 1.5, ' stroke-dasharray="5 4" opacity=".6"');
    [[-1, 22], [1, -22]].forEach(function (f) {
      var x = cx + f[0] * 34, y = cy;
      out += '<g transform="translate(' + x + ',' + y + ') rotate(' + f[1] + ')"><ellipse rx="7" ry="13" fill="#191D28"/><path d="M-3,-17 L0,-22 L3,-17" fill="none" stroke="#D92D20" stroke-width="1.6"/></g>';
      out += S.text(x + f[0] * 16, y + 4, '50%', { size: 12, fill: '#D92D20', anchor: f[0] < 0 ? 'end' : 'start' });
    });
    out += S.line({ x: cx - 34, y: cy + 30 }, { x: cx + 34, y: cy + 30 }, '#059669', 1.5, ' stroke-dasharray="4 3"');
    out += S.text(cx, cy + 48, KT.pick('約與肩同寬，腳尖內扣', 'about shoulder-width, toes turned in'), { size: 11, fill: '#059669', anchor: 'middle', weight: 600 });
    out += S.text(cx, 12, KT.pick('中線', 'CENTRELINE'), { size: 10, fill: '#D92D20', anchor: 'middle' });
    return out;
  }

  var api = w.KTLesson({
    list: L, prefix: 'wc',
    makeClip: WC.makeClip,
    info: function (s, lang) { return { a: s.zh, b: s.py.toUpperCase(), note: KT.t(s.note) }; },
    feet: function (s, side, lang) { return s.feet ? feetSVG(s, side, lang) : ''; },
    cardPre: function (s, a) { return KT.t(s.type); },
    cardSub: function (s) { return s.py; },
    pre: function (s, a) { return a.T('第 {n} 式 · {type} · 粵語 {py}', 'Technique {n} of 8 · {type} · Cantonese {py}', { n: s.n, type: KT.t(s.type), py: s.py }); },
    spec: [function (s, l) { return KT.t(s.key); }, function (s, l) { return KT.t(s.form); }, function (s, l) { return KT.t(s.ability); }],
    onRender: function (s, a) {
      d.getElementById('st-key').textContent = KT.t(s.key);
      d.getElementById('st-form').textContent = a.T('出自：', 'Found in: ') + KT.t(s.form);
      d.getElementById('feet-panel').style.display = s.feet ? '' : 'none';
      [].forEach.call(d.querySelectorAll('[data-guide]'), function (b) { b.setAttribute('aria-pressed', String((b.getAttribute('data-guide') === '1') === WC.GUIDE.on)); });
    },
    guide: function (a) {
      var T = a.T, l = a.st.lang;
      var rows = L.map(function (s) {
        return '<tr><td>' + esc(s.zh) + '</td><td>' + esc(s.py) + '</td><td>' + esc(s.en) + '</td><td>' + esc(KT.t(s.type)) + '</td><td>' + esc(KT.t(s.form)) + '</td></tr>';
      }).join('');
      return '<h2>' + T('詠春是什麼？', 'What is Wing Chun?') + '</h2>' +
        '<p>' + T('詠春拳是源自中國南方（廣東、福建一帶）的近身拳術，以簡潔、直接、經濟著稱。二十世紀經葉問在香港傳授後廣傳世界。詠春的核心概念包括中線理論、攻守同時、以及透過黐手訓練觸覺。',
          'Wing Chun is a close-range southern Chinese martial art (from the Guangdong–Fujian region) known for being simple, direct and economical. It spread worldwide after Ip Man taught it in Hong Kong in the 20th century. Its core ideas are the centreline, attacking and defending at the same time, and developing touch sensitivity through chi sao (sticking hands).') + '</p>' +
        '<h2>' + T('中線理論', 'Centreline theory') + '</h2>' +
        '<p>' + T('想像一條從頭頂垂直穿過身體中央的線。詠春的手法都圍繞這條線：守住自己的中線，並以兩點之間最短的直線攻擊對方的中線。這就是為什麼詠春拳出拳時手肘向下、拳頭停在身體正前方。',
          'Imagine a vertical line running down the middle of your body. Every Wing Chun hand technique works around it: protect your own centreline and attack the opponent\'s along the shortest straight path. That is why the elbow stays down and the fist stays directly in front of the body.') + '</p>' +
        '<h2>' + T('八個技巧一覽', 'The eight techniques at a glance') + '</h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + T('名稱', 'Name') + '</th><th>' + T('粵語拼音', 'Cantonese') + '</th><th>English</th><th>' + T('類型', 'Type') + '</th><th>' + T('出自', 'Found in') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<p class="note">' + T('拼音採用常見英文拼法，不同師門寫法略有不同（例如 Sao / Sau、Fuk / Fook）。', 'Romanisations follow common English spellings and vary between schools (e.g. Sao / Sau, Fuk / Fook).') + '</p>' +
        '<h2>' + T('學習順序建議', 'A sensible learning order') + '</h2>' +
        '<ol><li>' + T('先站好二字鉗羊馬，能放鬆站 2–3 分鐘。', 'Get comfortable holding the basic stance relaxed for 2–3 minutes.') + '</li>' +
        '<li>' + T('練日字衝拳，再進到連環拳。', 'Learn the vertical punch, then build to chain punching.') + '</li>' +
        '<li>' + T('透過小念頭學攤手、伏手、膀手與拍手。', 'Learn tan, fuk, bong and pak sao through Siu Nim Tao.') + '</li>' +
        '<li>' + T('在師父指導下開始單黐手與對練。', 'Start single sticking hands and partner drills with a sifu.') + '</li></ol>' +
        '<p>' + T('想比較其他拳法？可看 <a href="../strikes/">功夫基本拳法與腿法</a>（長拳沖拳是轉腰旋拳，與詠春日字拳很不同）。', 'Want to compare? See <a href="../strikes/">basic kung fu punches &amp; kicks</a> — the Changquan punch twists palm-down from the waist, very different from the Wing Chun vertical fist.') + '</p>' +
        '<h2>' + T('常見問題', 'Frequently asked questions') + '</h2>' +
        '<details><summary>' + T('詠春的「中線」是什麼？', 'What is the centreline?') + '</summary><p>' + T('一條從頭頂垂直穿過身體中央的假想線。詠春守住自己的中線，並用最短直線攻擊對方的中線。', 'An imaginary vertical line down the middle of the body. Wing Chun protects your own and attacks the opponent\'s along the shortest straight path.') + '</p></details>' +
        '<details><summary>' + T('詠春三大基本手形是什麼？', 'What are the three basic hand shapes?') + '</summary><p>' + T('攤手、膀手、伏手，都在第一套拳小念頭中練習。', 'Tan Sao, Bong Sao and Fuk Sao, all trained first in Siu Nim Tao.') + '</p></details>' +
        '<details><summary>' + T('可以自己在家學詠春嗎？', 'Can I learn Wing Chun at home?') + '</summary><p>' + T('馬步、衝拳和小念頭的手形可以在家練習；但黐手與對練需要師父和同伴，建議找合格的武館學習。', 'You can practise the stance, punches and Siu Nim Tao hand shapes at home, but chi sao and partner work need a sifu and training partners — find a qualified school.') + '</p></details>';
    }
  });

  [].forEach.call(d.querySelectorAll('[data-guide]'), function (b) {
    b.addEventListener('click', function () {
      WC.GUIDE.on = b.getAttribute('data-guide') === '1';
      [].forEach.call(d.querySelectorAll('[data-guide]'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      api.player.drawAt(api.player.elapsed);
    });
  });
})(window, document);
</script>
