      <h1 data-zh="菲律賓武術（Kali / Eskrima / Arnis）入門：棍法 8 課" data-en="Filipino Martial Arts Basics: Kali, Eskrima &amp; Arnis Stick in 8 Lessons"></h1>
      <p class="hx-lede" data-zh="菲律賓武術先學武器、再學空手，同一套角度用在棍、刀與徒手上。這 8 課用單棍（baston）學站姿、斜劈、直刺、8 字流動、屋頂擋、活手檢查與繳械，最後把同樣的角度用在空手。棕色是你的棍子，灰色人形是練習夥伴。" data-en="Filipino martial arts teach the weapon first and the empty hand second, using the same angles for stick, blade and hand. These 8 lessons use the single stick (baston): stance, diagonal strikes, the thrust, figure-8 flow, the roof block, the live-hand check and disarm, and finally the same angles with the empty hand. The brown stick is yours; the grey figure is your training partner."></p>

<script>
(function (w) {
  'use strict';
  var L = w.FMA.LIST;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  w.KTLesson({
    list: L, prefix: 'fma',
    makeClip: w.FMA.makeClip,
    info: function (s) { return { a: KT.name(s), b: KT.t(s.type).toUpperCase(), note: KT.t(s.note) }; },
    levelName: function (lv, T) { return T('目前速度：', 'Current speed: ') + (lv < 1 ? T('學習（慢動作）', 'Learning (slow motion)') : T('實際速度', 'Real speed')); },
    cardPre: function (s) { return KT.t(s.type); },
    cardSub: function (s, a) { return a.T('接觸點：', 'Contact: ') + KT.t(s.contact); },
    pre: function (s, a) { return a.T('第 {n} 課 · {type}', 'Lesson {n} of 8 · {type}', { n: s.n, type: KT.t(s.type) }); },
    spec: [function (s) { return KT.t(s.contact); }, function (s) { return KT.t(s.weapon); }, function (s) { return KT.t(s.ability); }],
    onRender: function (s) {
      document.getElementById('st-weapon').textContent = KT.t(s.weapon);
      document.getElementById('st-type').textContent = KT.t(s.type);
    },
    guide: function (a) {
      var T = a.T;
      var rows = L.map(function (s) {
        return '<tr><td>' + esc(KT.pick(s.zh, s.en)) + '</td><td>' + esc(KT.t(s.type)) + '</td><td>' + esc(KT.t(s.weapon)) + '</td><td>' + esc(KT.t(s.contact)) + '</td></tr>';
      }).join('');
      return '<h2>' + T('Kali、Eskrima、Arnis 有什麼不同？', 'Kali, Eskrima, Arnis — what is the difference?') + '</h2>' +
        '<p>' + T('這三個名稱都是指菲律賓武術（FMA），用哪個名稱主要取決於地區與流派，技術內容大同小異。菲律賓在 2009 年把 Arnis 定為國家武術與國家運動。所有流派的共同特色是：先學武器（通常是棍與刀），再把同一套角度用在空手。',
          'All three are names for the Filipino martial arts (FMA); which one is used depends mostly on region and school, and the content overlaps a great deal. In 2009 the Philippines made arnis its national martial art and sport. What every style shares is weapons first — usually stick and blade — with the same angles then applied to the empty hand.') + '</p>' +
        '<h2>' + T('八堂課一覽', 'The eight lessons at a glance') + '</h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + T('課程', 'Lesson') + '</th><th>' + T('類型', 'Type') + '</th><th>' + T('工具', 'Tool') + '</th><th>' + T('接觸點', 'Contact') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<h2>' + T('「角度」系統', 'The angle system') + '</h2>' +
        '<p>' + T('FMA 不是記住一招一式，而是把攻擊分成幾條「角度」：由上往下的正手與反手斜劈、水平橫打、由下往上的斜撩，以及直刺。每個流派的角度編號和數量不同（常見 5 到 12 個），但原則相同：只要學會防守每一條角度，不管對方拿的是棍、刀或空手，都能用同一套方法應對。',
          'Instead of memorising individual techniques, FMA sorts attacks into a few "angles": forehand and backhand diagonals from above, horizontal strikes, rising diagonals from below, and thrusts. Each style numbers them differently (commonly 5 to 12), but the principle is the same: learn to defend each angle and you can answer a stick, a blade or an empty hand the same way.') + '</p>' +
        '<h2>' + T('安全練習', 'Practise safely') + '</h2>' +
        '<ol><li>' + T('先單獨練習或打輪胎、打擊柱，再和夥伴對練。', 'Train alone or on a tyre or striking post before partner drills.') + '</li>' +
        '<li>' + T('對練時戴頭盔、護手與護目，從非常慢的速度開始。', 'Wear a helmet, hand and eye protection for partner drills, starting very slowly.') + '</li>' +
        '<li>' + T('使用藤棍或泡棉訓練棍，不要用硬木或金屬棍對練。', 'Use rattan or foam training sticks — never hardwood or metal for partner work.') + '</li>' +
        '<li>' + T('刀術只用鈍的訓練刀，並且只在教練指導下練習。', 'Blade work uses blunt trainers only, under an instructor.') + '</li></ol>' +
        '<p>' + T('相關課程：<a href="../../self-defence/krav-maga/">以色列格鬥術入門</a>、<a href="../../kungfu/wing-chun/">詠春入門</a>。', 'Related: <a href="../../self-defence/krav-maga/">Krav Maga basics</a> and <a href="../../kungfu/wing-chun/">Wing Chun basics</a>.') + '</p>' +
        '<h2>' + T('常見問題', 'Frequently asked questions') + '</h2>' +
        '<details><summary>' + T('為什麼要先學武器？', 'Why learn the weapon first?') + '</summary><p>' + T('武器放大了錯誤，讓距離、角度與時機更容易學會；而且同一套動作可以直接用在空手。', 'A weapon magnifies mistakes, making distance, angles and timing easier to learn — and the same movements carry straight over to the empty hand.') + '</p></details>' +
        '<details><summary>' + T('什麼是活手？', 'What is the live hand?') + '</summary><p>' + T('沒有拿武器的那隻手，用來檢查、推開或控制對方持武器的手。', 'The hand without the weapon, used to check, push or control the opponent\'s weapon hand.') + '</p></details>' +
