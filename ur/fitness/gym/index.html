<script>
(function (w) {
  'use strict';
  var L = w.GYM.LIST;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  w.KTLesson({
    list: L, prefix: 'gym',
    makeClip: w.GYM.makeClip,
    info: function (s, lang) { return { a: KT.pick(s.zh, s.en), b: KT.t(s.type).toUpperCase(), note: KT.t(s.note) }; },
    levelName: function (lv, T) { return T('目前程度：', 'Current level: ') + (lv < 1 ? T('初學版本', 'Beginner version') : T('標準動作', 'Standard')); },
    cardPre: function (s, a) { return KT.t(s.type); },
    cardSub: function (s, a) { return KT.t(s.muscles); },
    pre: function (s, a) { return a.T('第 {n} 個動作 · {type}', 'Exercise {n} of 10 · {type}', { n: s.n, type: KT.t(s.type) }) + (a.st.level < 1 && s.easy ? a.T(' · 初學版本', ' · beginner version') : ''); },
    spec: [function (s, l) { return KT.t(s.muscles); }, function (s, l) { return KT.t(s.equip); }, function (s, l) { return KT.t(s.dose); }],
    timerGo: function (T) { return T('開始計時', 'Start hold'); },
    onRender: function (s, a) {
      document.getElementById('st-mus').textContent = KT.t(s.muscles);
      document.getElementById('st-type').textContent = KT.t(s.type);
      document.getElementById('st-dose').textContent = KT.t(s.dose);
      document.getElementById('hold-timer').hidden = s.id !== 'plank';
    },
    guide: function (a) {
      var T = a.T, l = a.st.lang;
      var rows = L.map(function (s) {
        return '<tr><td>' + esc(KT.pick(s.zh, s.en)) + '</td><td>' + esc(KT.t(s.type)) + '</td><td>' + esc(KT.t(s.muscles)) + '</td><td>' + esc(KT.t(s.dose)) + '</td></tr>';
      }).join('');
      return '<h2>' + T('十個動作一覽', 'The ten exercises at a glance') + '</h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + T('動作', 'Exercise') + '</th><th>' + T('類型', 'Pattern') + '</th><th>' + T('主要肌群', 'Main muscles') + '</th><th>' + T('組數 × 次數', 'Sets × reps') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<h2>' + T('初學者的一週範例', 'A simple beginner week') + '</h2>' +
        '<p>' + T('每週練 2–3 天、中間休息一天，每次做全身：', 'Train 2–3 days a week with a rest day between, full body each time:') + '</p>' +
        '<ul><li><b>' + T('A 日：', 'Day A: ') + '</b>' + T('深蹲、臥推（或伏地挺身）、划船、平板支撐', 'Squat, bench press (or push-up), row, plank') + '</li>' +
        '<li><b>' + T('B 日：', 'Day B: ') + '</b>' + T('硬舉（或臀橋）、肩推、引體向上（或離心）、弓箭步', 'Deadlift (or glute bridge), overhead press, pull-up (or negatives), lunge') + '</li></ul>' +
        '<p>' + T('A、B 日輪流做。每個動作 2–4 組，選一個姿勢正確、做完還能多做 1–2 下的重量；能輕鬆完成時，下次再加一點點重量或次數。', 'Alternate A and B. Do 2–4 sets of each with a weight you can lift with good form and 1–2 reps to spare; when it feels easy, add a little weight or a rep next time.') + '</p>' +
        '<h2>' + T('呼吸與核心收緊', 'Breathing and bracing') + '</h2>' +
        '<p>' + T('做深蹲、硬舉、肩推這類站姿槓鈴動作時，動作前先深吸一口氣到腹部、像要被打肚子一樣收緊核心，下降時保持，用力完成後再吐氣。輕重量、高次數的動作則保持正常呼吸，不要憋氣。有高血壓或心臟問題的人請先詢問醫師。',
          'For standing barbell lifts like the squat, deadlift and press, take a deep breath into your belly before the rep and brace as if someone were about to poke your stomach; hold it on the way down and breathe out after the hard part. For light, high-rep work just breathe normally — don\'t hold your breath. If you have high blood pressure or heart problems, ask your doctor first.') + '</p>' +
        '<h2>' + T('安全須知', 'Safety') + '</h2>' +
        '<ol><li>' + T('先熱身 5–10 分鐘，再用空槓或輕重量做 1–2 組熱身組。', 'Warm up for 5–10 minutes, then do 1–2 light sets with an empty bar or light weight.') + '</li>' +
        '<li>' + T('臥推和深蹲請在有安全槓的架子內練習，或請人保護。', 'Bench and squat inside a rack with safety bars, or with a spotter.') + '</li>' +
        '<li>' + T('姿勢跑掉就停，重量永遠排在姿勢後面。', 'Stop when your form breaks down — form always comes before weight.') + '</li>' +
        '<li>' + T('關節疼痛（不是肌肉痠）就停止，必要時請醫師或物理治療師檢查。', 'Stop for joint pain (not muscle burn) and get it checked by a doctor or physio if needed.') + '</li></ol>' +
        '<p>' + T('想把力量用在比賽上？看看 <a href="../../hyrox/">HYROX 8 大關卡</a>。', 'Want to put your strength to the test? See <a href="../../hyrox/">the 8 HYROX stations</a>.') + '</p>' +
        '<h2>' + T('常見問題', 'Frequently asked questions') + '</h2>' +
        '<details><summary>' + T('初學者每週要練幾天？', 'How many days a week should a beginner train?') + '</summary><p>' + T('2–3 天全身訓練就足夠，中間讓肌肉休息恢復。規律比次數多更重要。', 'Two or three full-body sessions with rest days between is plenty. Consistency matters more than frequency.') + '</p></details>' +
        '<details><summary>' + T('做到力竭比較好嗎？', 'Should I train to failure?') + '</summary><p>' + T('初學者不需要。每組保留 1–2 下的餘力，姿勢會比較好、受傷風險也低，進步一樣快。', 'Beginners don\'t need to. Leaving 1–2 reps in reserve keeps form clean and injury risk low, and progress is just as fast.') + '</p></details>' +
        '<details><summary>' + T('為什麼槓鈴要在腳掌中間上方？', 'Why keep the bar over mid-foot?') + '</summary><p>' + T('站姿槓鈴動作中，腳掌中間是身體的平衡點；槓鈴保持在它正上方，你就不會被重量往前或往後拉，動作也最省力。', 'In standing barbell lifts mid-foot is your balance point; keeping the bar over it stops the weight pulling you forwards or backwards and makes the lift most efficient.') + '</p></details>';
    }
