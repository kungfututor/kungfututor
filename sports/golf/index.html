<script>
(function (w) {
  'use strict';
  var L = w.GOLF.LIST;
  var CLUB = { iron: { zh: '7 號鐵桿', en: '7-iron' }, driver: { zh: '一號木（開球木）', en: 'Driver' }, wedge: { zh: '挖起桿', en: 'Wedge' }, putter: { zh: '推桿', en: 'Putter' } };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  w.KTLesson({
    list: L, prefix: 'golf',
    makeClip: w.GOLF.makeClip,
    info: function (s, lang) { return { a: KT.pick(s.zh, s.en), b: KT.t(CLUB[s.club]).toUpperCase(), note: KT.t(s.note) }; },
    levelName: function (lv, T) { return T('目前速度：', 'Current speed: ') + (lv < 1 ? T('學習（慢 3 倍）', 'Learning (3× slower)') : T('實際節奏', 'Real tempo')); },
    cardPre: function (s, a) { return KT.t(s.type); },
    cardSub: function (s, a) { return KT.t(s.key); },
    pre: function (s, a) { return a.T('第 {n} 課 · {type} · {club}', 'Lesson {n} of 10 · {type} · {club}', { n: s.n, type: KT.t(s.type), club: KT.t(CLUB[s.club]) }); },
    spec: [function (s, l) { return KT.t(s.key); }, function (s, l) { return KT.t(CLUB[s.club]); }, function (s, l) { return KT.t(s.ability); }],
    onRender: function (s, a) {
      document.getElementById('st-key').textContent = KT.t(s.key);
      document.getElementById('st-type').textContent = KT.t(s.type);
    },
    guide: function (a) {
      var T = a.T, l = a.st.lang;
      var rows = L.map(function (s) {
        return '<tr><td>' + esc(KT.pick(s.zh, s.en)) + '</td><td>' + esc(KT.t(s.type)) + '</td><td>' + esc(KT.t(CLUB[s.club])) + '</td><td>' + esc(KT.t(s.key)) + '</td></tr>';
      }).join('');
      return '<h2>' + T('先學會握桿', 'First, the grip') + '</h2>' +
        '<p>' + T('右手球員：左手先握，球桿斜放在手指根部，握好後從上往下看能看到左手 2–3 個指節；右手接著握上，右手掌心面向目標，蓋住左手拇指。三種常見握法——重疊式、交錯式、十指式——都可以，選最舒服的。握力大約是 10 分中的 4–5 分，太緊會讓手臂僵硬、揮不快。',
          'For a right-handed golfer: the left hand goes on first, with the grip running diagonally across the base of the fingers; looking down you should see 2–3 knuckles. The right hand goes below it, palm facing the target, covering the left thumb. The overlap, interlock and ten-finger grips all work — pick the most comfortable. Grip pressure should be about 4–5 out of 10; squeezing tight locks up the arms and slows the club.') + '</p>' +
        '<h2>' + T('十堂課一覽', 'The ten lessons at a glance') + '</h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + T('課程', 'Lesson') + '</th><th>' + T('類型', 'Type') + '</th><th>' + T('球桿', 'Club') + '</th><th>' + T('重點', 'Key point') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<h2>' + T('球要放在哪裡？', 'Where should the ball go?') + '</h2>' +
        '<ul><li>' + T('中短鐵桿：站姿中間或稍微偏前。', 'Mid and short irons: middle of the stance or slightly forward.') + '</li>' +
        '<li>' + T('一號木：前腳跟內側，球放在球座上。', 'Driver: opposite the inside of the front heel, on a tee.') + '</li>' +
        '<li>' + T('切球：中間偏後腳，讓手自然在球前。', 'Chip: slightly back of centre so the hands are naturally ahead.') + '</li>' +
        '<li>' + T('推桿：中間偏前，眼睛在球的正上方。', 'Putt: slightly forward of centre, eyes directly over the ball.') + '</li></ul>' +
        '<h2>' + T('兩個看揮桿的角度', 'Two ways to watch a swing') + '</h2>' +
        '<p>' + T('教練通常從兩個角度看揮桿：「正面」（站在球員前方）看重心轉移、頭部位置和揮桿弧線；「側面（球線後方）」（站在球員後面，看向目標）看姿勢角度和揮桿平面。用手機從這兩個角度錄下自己的揮桿，和本頁動畫比較，是最便宜有效的練習方法。',
          'Coaches watch a swing from two angles: face-on (in front of the golfer) for weight shift, head position and the swing arc, and down the line (behind the golfer, looking at the target) for posture and swing plane. Filming yourself from both angles on your phone and comparing with these animations is the cheapest, most effective practice there is.') + '</p>' +
        '<h2>' + T('安全與熱身', 'Safety and warm-up') + '</h2>' +
        '<ol><li>' + T('揮桿前先確認周圍和前方沒有人。', 'Always check nobody is nearby or in front before you swing.') + '</li>' +
        '<li>' + T('先做肩膀、髖部和背部的轉體熱身，再從短桿、半揮桿開始。', 'Warm up shoulders, hips and back with gentle turns, then start with short clubs and half swings.') + '</li>' +
        '<li>' + T('揮桿時背部或手肘疼痛，請停止並請教練或醫師檢查。', 'If your back or elbows hurt when you swing, stop and get it checked by a coach or doctor.') + '</li></ol>' +
        '<h2>' + T('常見問題', 'Frequently asked questions') + '</h2>' +
        '<details><summary>' + T('為什麼我的球總是往右彎（右曲球）？', 'Why does my ball curve to the right (a slice)?') + '</summary><p>' + T('最常見的原因是下桿時手和肩膀先動，桿頭由外往內切過球，加上桿面打開。練習「下半身先動」的下桿順序（第 4 課），並檢查握桿不要太弱。', 'Most often the hands and shoulders start the downswing, so the club cuts across the ball from outside to in with an open face. Practise the lower-body-first sequence (lesson 4) and check your grip isn\'t too weak.') + '</p></details>' +
        '<details><summary>' + T('揮桿節奏要多快？', 'How fast should I swing?') + '</summary><p>' + T('重點是比例，不是速度：上桿約為下桿的 3 倍時間。用 80% 的力量、能站穩收桿，通常打得最好。', 'Ratio matters more than speed: the backswing takes about three times as long as the downswing. Swinging at 80% and holding your finish usually gives the best results.') + '</p></details>' +
        '<details><summary>' + T('頭真的要完全不動嗎？', 'Does my head really have to stay perfectly still?') + '</summary><p>' + T('不必完全不動，頭會隨身體轉動有一點點移動；重點是不要明顯上下或左右大幅晃動，擊球前頭保持在球後方。', 'Not perfectly — it moves a little as the body turns. The key is no big sway or bob, and keeping the head behind the ball until impact.') + '</p></details>';
    }
  });
})(window);
</script>
