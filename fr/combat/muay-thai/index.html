<script>
(function (w) {
  'use strict';
  var L = w.MUAYTHAI.LIST;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  w.KTLesson({
    list: L, prefix: 'mt',
    makeClip: w.MUAYTHAI.makeClip,
    info: function (s, lang) { return { a: KT.name(s), b: KT.t(s.type).toUpperCase(), note: KT.t(s.note) }; },
    levelName: function (lv, T) { return T('目前速度：', 'Current speed: ') + (lv < 1 ? T('學習（慢動作）', 'Learning (slow motion)') : T('實戰速度', 'Fight speed')); },
    cardPre: function (s, a) { return KT.t(s.type); },
    cardSub: function (s, a) { return a.T('接觸點：', 'Contact: ') + KT.t(s.contact); },
    pre: function (s, a) { return a.T('第 {n} 個技術 · {type}', 'Technique {n} of 10 · {type}', { n: s.n, type: KT.t(s.type) }); },
    spec: [function (s, l) { return KT.t(s.contact); }, function (s, l) { return KT.t(s.target); }, function (s, l) { return KT.t(s.ability); }],
    onRender: function (s, a) {
      document.getElementById('st-contact').textContent = KT.t(s.contact);
      document.getElementById('st-type').textContent = KT.t(s.type);
    },
    guide: function (a) {
      var T = a.T, l = a.st.lang;
      var rows = L.map(function (s) {
        return '<tr><td>' + esc(KT.pick(s.zh, s.en)) + '</td><td>' + esc(KT.t(s.type)) + '</td><td>' + esc(KT.t(s.contact)) + '</td><td>' + esc(KT.t(s.target)) + '</td></tr>';
      }).join('');
      return '<h2>' + T('什麼是泰拳？', 'What is Muay Thai?') + '</h2>' +
        '<p>' + T('泰拳是泰國的國技，被稱為「八肢藝術」，因為它用雙拳、雙肘、雙膝和雙脛共八個部位攻擊，還有獨特的近身箍頸。比賽前選手會表演傳統的拜師舞（Wai Kru Ram Muay），向老師與傳統致敬。今天泰拳是全世界最受歡迎的站立格鬥運動之一，也是綜合格鬥（MMA）站立技術的重要基礎。',
          'Muay Thai is Thailand\'s national sport, known as the "art of eight limbs" because it strikes with eight points — two fists, two elbows, two knees and two shins — plus its own stand-up clinch. Before a fight, boxers perform the traditional Wai Kru Ram Muay to honour their teachers and tradition. Today it is one of the world\'s most popular stand-up combat sports and a key striking base for MMA.') + '</p>' +
        '<h2>' + T('十個技術一覽', 'The ten techniques at a glance') + '</h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + T('技術', 'Technique') + '</th><th>' + T('類型', 'Type') + '</th><th>' + T('接觸點', 'Contact') + '</th><th>' + T('目標', 'Target') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<h2>' + T('泰拳和拳擊站架有什麼不同？', 'How is the stance different from boxing?') + '</h2>' +
        '<p>' + T('拳擊只需要防拳，所以身體比較側、重心比較平均；泰拳還要防踢、膝和肘，因此身體更正面、站得更高、重心偏後，前腳保持輕盈，隨時可以提膝擋踢或前蹬。', 'Boxers only defend punches, so they stand more side-on with even weight. In Muay Thai you also face kicks, knees and elbows, so the stance is squarer, taller and weighted to the back leg, keeping the lead foot light to check kicks or teep.') + '</p>' +
        '<h2>' + T('入門訓練與安全', 'Starting out safely') + '</h2>' +
        '<ol><li>' + T('先跳繩或慢跑熱身 5–10 分鐘，再做髖部、腳踝與肩膀的活動。', 'Warm up with 5–10 minutes of skipping or jogging, then mobilise hips, ankles and shoulders.') + '</li>' +
        '<li>' + T('先在空氣中或沙袋上把動作練對，再加速度和力量。', 'Get each technique right in the air or on the bag before adding speed and power.') + '</li>' +
        '<li>' + T('對打時戴拳套、護齒、護脛；肘與膝只在手靶或沙袋上練。', 'Spar in gloves, a mouthguard and shin guards; throw elbows and knees only on pads or bags.') + '</li>' +
        '<li>' + T('脛骨會隨著訓練慢慢變得耐打，不要用硬物敲打脛骨。', 'Shins toughen gradually with normal training — never strike hard objects to "condition" them.') + '</li></ol>' +
        '<p>' + T('想加強基本拳腳與步型？可以參考 <a href="../../kungfu/strikes/">基本拳法與腿法</a>；想練體能，看看 <a href="../../fitness/gym/">健身房 10 個基本動作</a>。', 'Want stronger basic strikes? See <a href="../../kungfu/strikes/">basic punches &amp; kicks</a>; for conditioning, try <a href="../../fitness/gym/">the 10 gym basics</a>.') + '</p>' +
        '<h2>' + T('常見問題', 'Frequently asked questions') + '</h2>' +
        '<details><summary>' + T('為什麼叫「八肢藝術」？', 'Why "the art of eight limbs"?') + '</summary><p>' + T('因為泰拳用雙拳、雙肘、雙膝、雙脛共八個部位攻擊。', 'Because it strikes with eight points: two fists, two elbows, two knees and two shins.') + '</p></details>' +
        '<details><summary>' + T('泰拳踢腿用腳背還是脛骨？', 'Do you kick with the foot or the shin?') + '</summary><p>' + T('中段踢和低踢都用小腿脛骨，比腳背耐打得多，配合轉髖力量也更大。', 'The roundhouse and low kick land with the shin — far tougher than the foot and more powerful when the hip turns over.') + '</p></details>' +
        '<details><summary>' + T('初學者多久可以對打？', 'When can a beginner start sparring?') + '</summary><p>' + T('通常先練幾個月的基本動作、手靶與沙袋，等教練認為你能控制力道與防守，再從輕度技術對打開始。', 'Usually after a few months of technique, pads and bag work, when your coach is happy you can control power and defend yourself — starting with light technical sparring.') + '</p></details>';
    }
  });
})(window);
</script>
