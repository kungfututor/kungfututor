      <h1 data-zh="摔跤入門：自由式、古典式與美式學生摔跤 8 課" data-en="Wrestling Basics: Freestyle, Greco-Roman and Folkstyle in 8 Lessons"></h1>
      <p class="hx-lede" data-zh="摔跤是最古老的運動之一，有三種主要式樣：奧運的自由式和古典式，以及美國學校的美式學生摔跤。這 8 課從站架開始，學抱腿摔、防摔、拉臂繞背和古典式抱腰摔，再學地面的抱腹翻、站立逃脫與半扣頸壓制。紅色摔跤服是你，藍色是夥伴，紅圈標示接觸點。" data-en="Wrestling is one of the oldest sports, with three main styles: the Olympic styles freestyle and Greco-Roman, and folkstyle, used in American schools and colleges. These 8 lessons start with the stance, then the double-leg, sprawl, arm drag and Greco-Roman body lock, and finish on the mat with the gut wrench, stand-up escape and half nelson pin. Red singlet is you, blue is your partner; the red ring marks the point of contact."></p>

<script>
(function (w) {
  'use strict';
  var L = w.WRESTLING.LIST;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  w.KTLesson({
    list: L, prefix: 'wrestling',
    makeClip: w.WRESTLING.makeClip,
    info: function (s) { return { a: KT.name(s), b: KT.t(s.type).toUpperCase(), note: KT.t(s.note) }; },
    levelName: function (lv, T) { return T('目前速度：', 'Current speed: ') + (lv < 1 ? T('學習（慢動作）', 'Learning (slow motion)') : T('實戰速度', 'Fight speed')); },
    cardPre: function (s) { return KT.t(s.type); },
    cardSub: function (s, a) { return a.T('階段：', 'Phase: ') + KT.t(s.phase); },
    pre: function (s, a) { return a.T('第 {n} 個技術 · {type}', 'Technique {n} of 8 · {type}', { n: s.n, type: KT.t(s.type) }); },
    spec: [function (s) { return KT.t(s.contact); }, function (s) { return KT.t(s.phase); }, function (s) { return KT.t(s.ability); }],
    onRender: function (s) {
      document.getElementById('st-phase').textContent = KT.t(s.phase);
      document.getElementById('st-type').textContent = KT.t(s.type);
    },
    guide: function (a) {
      var T = a.T;
      var rows = L.map(function (s) {
        return '<tr><td>' + esc(KT.pick(s.zh, s.en)) + '</td><td>' + esc(KT.t(s.type)) + '</td><td>' + esc(KT.t(s.phase)) + '</td><td>' + esc(KT.t(s.style)) + '</td></tr>';
      }).join('');
      return '<h2>' + T('摔跤的三種式樣', 'The three styles of wrestling') + '</h2>' +
        '<p>' + T('摔跤是人類最古老的運動之一，現代有三種主要式樣。自由式和古典式是奧運項目：自由式可以攻擊對方的腿，古典式只能攻擊腰部以上，不能抓腿或絆腿。美式學生摔跤（folkstyle）是美國中學與大學使用的式樣，更重視在地面上控制對方、從下面逃脫和壓制。', 'Wrestling is one of the oldest sports there is, and today it has three main styles. Freestyle and Greco-Roman are Olympic sports: freestyle allows attacks on the legs, while Greco-Roman allows holds above the waist only — no grabbing or tripping the legs. Folkstyle is the style used in American schools and colleges, with more weight on controlling the opponent on the mat, escaping from underneath and pinning.') + '</p>' +
        '<h2>' + T('八課一覽', 'The eight lessons at a glance') + '</h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + T('技術', 'Technique') + '</th><th>' + T('類型', 'Type') + '</th><th>' + T('階段', 'Phase') + '</th><th>' + T('式樣', 'Style') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<h2>' + T('怎樣得分與獲勝', 'How scoring works') + '</h2>' +
        '<p>' + T('自由式與古典式（世界摔跤聯合會規則）：摔倒通常得 2 分，把對方推出界外得 1 分，讓對方背部翻過墊子（例如抱腹翻）得 2 分，大幅度的摔可以得到更多分。美式高中規則（NFHS）：摔倒從 2024–25 季起是 3 分，逃脫 1 分，反轉 2 分，差點壓制另有分數。', 'Freestyle and Greco-Roman (United World Wrestling rules): a takedown usually scores 2 points, pushing the opponent out of the zone scores 1, turning their back over the mat (as in the gut wrench) scores 2, and big high-amplitude throws can score more. US high-school rules (NFHS): a takedown has scored 3 points since the 2024–25 season, an escape 1, a reversal 2, and near falls earn extra points.') + '</p>' +
        '<p>' + T('不論哪種式樣，壓制（把對方雙肩壓在墊上）都直接結束比賽；分數差距夠大也會提前獲勝。規則常常更新，比賽前請查看主辦單位的最新規則。', 'In every style a pin — holding both of the opponent\'s shoulders to the mat — ends the match at once, and a big enough points lead also wins early. Rules change often, so check the organiser\'s current rules before you compete.') + '</p>' +
        '<h2>' + T('入門與安全', 'Starting out safely') + '</h2>' +
        '<ol><li>' + T('先學會安全倒地和站架，再學摔法。', 'Learn to fall safely and the stance before learning takedowns.') + '</li>' +
        '<li>' + T('摔法只在軟墊上、在教練指導下練習。', 'Practise takedowns only on mats, with a coach.') + '</li>' +
        '<li>' + T('不扭對方的脖子或關節——這些在摔跤裡都是犯規。', 'Never crank the neck or twist joints — they are illegal in wrestling.') + '</li>' +
        '<li>' + T('和體重、程度相近的夥伴練習，從慢速、低抵抗開始。', 'Train with a partner of similar size and level, starting slowly with light resistance.') + '</li></ol>' +
        '<p>' + T('相關課程：<a href="../mma/">MMA 入門</a>、<a href="../bjj/">巴西柔術入門</a>、<a href="../judo/">柔道入門</a>。', 'Related: <a href="../mma/">MMA basics</a>, <a href="../bjj/">BJJ basics</a> and <a href="../judo/">judo basics</a>.') + '</p>' +
        '<h2>' + T('常見問題', 'Frequently asked questions') + '</h2>' +
        '<details><summary>' + T('初學者應該選哪種式樣？', 'Which style should a beginner choose?') + '</summary><p>' + T('通常跟著你附近的學校或俱樂部；三種式樣的站架、抱腿和地面控制大部分是相通的。', 'Usually whichever your local school or club teaches — the stance, takedowns and mat control carry over between all three.') + '</p></details>' +
        '<details><summary>' + T('摔跤對其他格鬥運動有幫助嗎？', 'Does wrestling help with other combat sports?') + '</summary><p>' + T('非常有幫助。綜合格鬥中，摔跤能力決定比賽在站立還是地面進行。', 'A lot. In MMA, wrestling decides whether the fight stays standing or goes to the ground.') + '</p></details>' +
        '<details><summary>' + T('什麼是壓制（fall）？', 'What is a pin (fall)?') + '</summary><p>' + T('把對方雙肩同時壓在墊上一段短時間，比賽立刻結束並獲勝。', 'Holding both of the opponent\'s shoulders to the mat at the same time for a moment; the match ends at once and you win.') + '</p></details>';
    }
  });
})(window);
</script>
