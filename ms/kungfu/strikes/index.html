<script>
(function (w) {
  'use strict';
  var L = w.STRIKES.LIST;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  w.KTLesson({
    list: L, prefix: 'sk',
    makeClip: w.STRIKES.makeClip,
    info: function (s, lang) { return { a: s.zh + ' ' + s.py, b: s.en.toUpperCase(), note: KT.t(s.note) }; },
    levelName: function (lv, T) { return T('目前程度：', 'Current level: ') + (lv < 1 ? T('初學（低踢）', 'Beginner (low kicks)') : T('標準高度', 'Standard height')); },
    cardPre: function (s, a) { return KT.t(s.type); },
    cardSub: function (s, a) { return a.T('力點：', 'Strikes with: ') + KT.t(s.point); },
    pre: function (s, a) { return a.T('第 {n} 式 · {type} · 拼音 {py}', 'Technique {n} of 6 · {type} · Pinyin {py}', { n: s.n, type: KT.t(s.type), py: s.py }); },
    spec: [function (s, l) { return KT.t(s.point); }, function (s, l) { return KT.t(s.height); }, function (s, l) { return KT.t(s.ability); }],
    onRender: function (s, a) {
      document.getElementById('st-point').textContent = KT.t(s.point);
      document.getElementById('st-type').textContent = KT.t(s.type);
    },
    guide: function (a) {
      var T = a.T, l = a.st.lang;
      var rows = L.map(function (s) {
        return '<tr><td>' + esc(s.zh + ' ' + s.py) + '</td><td>' + esc(s.en) + '</td><td>' + esc(KT.t(s.type)) + '</td><td>' + esc(KT.t(s.point)) + '</td><td>' + esc(KT.t(s.height)) + '</td></tr>';
      }).join('');
      return '<h2>' + T('先學會握拳', 'First, make a proper fist') + '</h2>' +
        '<p>' + T('四指併攏用力捲入掌心，拇指橫扣在食指與中指的第二節上，不要包在四指裡面。手腕要直，讓拳面與前臂成一直線——手腕彎曲是初學者最常見的受傷原因。',
          'Roll the four fingers tightly into the palm and fold the thumb across the middle sections of the index and middle fingers — never tuck it inside. Keep the wrist straight so the knuckles line up with the forearm; a bent wrist is the most common beginner injury.') + '</p>' +
        '<h2>' + T('六個技巧一覽', 'The six techniques at a glance') + '</h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + T('技巧', 'Technique') + '</th><th>English</th><th>' + T('類型', 'Type') + '</th><th>' + T('力點', 'Striking point') + '</th><th>' + T('高度', 'Height') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<h2>' + T('屈伸性腿法 vs 直擺性腿法', 'Bend-and-extend kicks vs straight-leg swings') + '</h2>' +
        '<p>' + T('彈腿、蹬腿、側踹屬於「屈伸性腿法」：先提膝，再把腿伸出擊打，重點是路線與力點。正踢腿屬於「直擺性腿法」：腿全程伸直往上擺，主要用來練柔軟度與髖部力量，是學高踢腿的基礎。',
          'The snap kick, heel thrust and side kick are bend-and-extend kicks: chamber the knee, then extend to strike — the line and striking point are what matter. The front stretch kick is a straight-leg swing: the leg stays straight all the way up, building flexibility and hip strength for higher kicks later.') + '</p>' +
        '<h2>' + T('安全練習', 'Practise safely') + '</h2>' +
        '<ol><li>' + T('先熱身髖、膝、踝與肩，冷身時不要用力甩腿。', 'Warm up hips, knees, ankles and shoulders; never swing hard kicks when cold.') + '</li>' +
        '<li>' + T('出拳出腿不要把關節猛力鎖死，留一點彎度並控制收回。', 'Don\'t snap joints into a hard lock — keep a little give and control the return.') + '</li>' +
        '<li>' + T('對靶或與人練習時使用護具，並在教練指導下進行。', 'Use pads and train under an instructor when hitting targets or working with a partner.') + '</li></ol>' +
        '<p>' + T('還沒練過步型？建議先看 <a href="../stances/">功夫五大步型</a>，沖拳與推掌都是在弓步上完成的。', 'New to stances? Start with <a href="../stances/">the five basic stances</a> — the punch and palm strike are both done in bow stance.') + '</p>' +
        '<h2>' + T('常見問題', 'Frequently asked questions') + '</h2>' +
        '<details><summary>' + T('彈腿和蹬腿有什麼不同？', 'Snap kick vs heel thrust — what\'s the difference?') + '</summary><p>' + T('彈腿腳面繃直、小腿快速彈出，用腳尖擊打；蹬腿腳尖勾起，把腳跟直線推出，用腳跟擊打。', 'The snap kick points the toes and whips the lower leg out, striking with the tip of the foot; the heel thrust pulls the toes back and pushes the heel out in a straight line.') + '</p></details>' +
        '<details><summary>' + T('出拳時拳心為什麼要轉向下？', 'Why does the fist turn palm-down?') + '</summary><p>' + T('從腰間拳心向上出發、到終點轉成拳心向下，可以讓拳面對準目標、手臂結構更穩固，也是長拳沖拳的標準要求。', 'Starting palm-up at the waist and finishing palm-down lines the knuckles up with the target and locks the arm into a strong structure — the standard Changquan punch.') + '</p></details>' +
        '<details><summary>' + T('踢不高怎麼辦？', 'What if I can\'t kick high?') + '</summary><p>' + T('先選「初學 · 低踢」程度，把路線和平衡做對；每天做正踢腿與腿後肌伸展，高度會慢慢增加。', 'Use the Beginner (low kicks) level and get the line and balance right first; daily front stretch kicks and hamstring stretches will raise your height over time.') + '</p></details>';
    }
  });
})(window);
</script>
