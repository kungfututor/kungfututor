      <h1 data-zh="柔道入門：受身、摔、壓制與關節技 8 課" data-en="Judo Basics: Breakfalls, Throws, Hold-Downs and the Armlock in 8 Lessons"></h1>
      <p class="hx-lede" data-zh="柔道是 1882 年由嘉納治五郎在東京創立的日本武道，也是奧運項目，意思是「柔之道」。這 8 課從禮、自然體與組手開始，學會受身，再學四種基本摔法、袈裟固壓制與腕挫十字固。藍色柔道服是你，白色是夥伴，紅圈標示接觸點。" data-en="Judo is a Japanese martial art and Olympic sport founded by Jigoro Kano in Tokyo in 1882; the name means &quot;the gentle way&quot;. These 8 lessons start with the bow, posture and grips, teach you to fall safely, then four basic throws, the scarf hold-down and the cross armlock. Blue judogi is you, white is your partner; the red ring marks the point of contact."></p>

        <li><b data-zh="固技" data-en="Katame-waza"></b><span data-zh="壓制與關節技" data-en="Hold-downs and the armlock"></span></li>

<script>
(function (w) {
  'use strict';
  var L = w.JUDO.LIST;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  w.KTLesson({
    list: L, prefix: 'judo',
    makeClip: w.JUDO.makeClip,
    info: function (s) { return { a: KT.name(s), b: KT.t(s.type).toUpperCase(), note: KT.t(s.note) }; },
    levelName: function (lv, T) { return T('目前速度：', 'Current speed: ') + (lv < 1 ? T('學習（慢動作）', 'Learning (slow motion)') : T('實戰速度', 'Fight speed')); },
    cardPre: function (s) { return KT.t(s.type); },
    cardSub: function (s, a) { return a.T('階段：', 'Phase: ') + KT.t(s.phase); },
    pre: function (s, a) { return a.T('第 {n} 個技術 · {type}', 'Technique {n} of 8 · {type}', { n: s.n, type: KT.t(s.type) }); },
    spec: [function (s) { return KT.t(s.contact); }, function (s) { return KT.t(s.phase); }, function (s) { return KT.t(s.ability); }],
    onRender: function (s) {
      document.getElementById('st-phase').textContent = KT.t(s.phase);
      document.getElementById('st-type').textContent = KT.t(s.type);
    },
    guide: function (a) {
      var T = a.T;
      var rows = L.map(function (s) {
        return '<tr><td>' + esc(KT.pick(s.zh, s.en)) + '</td><td>' + esc(KT.t(s.type)) + '</td><td>' + esc(KT.t(s.phase)) + '</td><td>' + esc(KT.t(s.contact)) + '</td></tr>';
      }).join('');
      return '<h2>' + T('什麼是柔道？', 'What is judo?') + '</h2>' +
        '<p>' + T('柔道是嘉納治五郎在 1882 年於東京創立的日本武道，他把傳統柔術中危險的技術去掉，留下可以全力安全練習的摔法、壓制、勒頸和關節技，道場叫「講道館」。柔道的意思是「柔之道」：利用對方的力量和平衡，而不是硬碰硬。柔道 1964 年東京奧運首次成為奧運項目，女子柔道自 1992 年起正式列入。', 'Judo is a Japanese martial art founded by Jigoro Kano in Tokyo in 1882. He took the older jujutsu styles, removed the most dangerous techniques and kept throws, hold-downs, chokes and armlocks that can be practised at full effort safely; his school is the Kodokan. Judo means "the gentle way": use the partner\'s force and balance instead of meeting strength with strength. Judo joined the Olympics at Tokyo 1964, and women\'s judo has been an Olympic event since 1992.') + '</p>' +
        '<h2>' + T('八課一覽', 'The eight lessons at a glance') + '</h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + T('技術', 'Technique') + '</th><th>' + T('類型', 'Type') + '</th><th>' + T('階段', 'Phase') + '</th><th>' + T('接觸點', 'Contact') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<h2>' + T('怎樣得分與獲勝', 'How scoring works') + '</h2>' +
        '<p>' + T('一本直接獲勝：把對方有力、快速地摔到大致背部著地；壓制對方 20 秒；或用勒頸、關節技讓對方認輸。摔得不夠完整、或壓制 10 秒，是技有；兩個技有合起來等於一本。國際柔聯的規則每隔幾年會檢討更新，比賽前請以最新規則為準。', 'Ippon wins the match at once: a throw that lands the opponent largely on their back with force and speed, a 20-second hold-down, or a submission to a choke or armlock. A less complete throw, or a 10-second hold-down, is waza-ari, and two waza-ari add up to ippon. The International Judo Federation reviews its rules every few years, so check the current version before a competition.') + '</p>' +
        '<p>' + T('現代柔道規則禁止用手抓、勾或碰對方的腿，違者會被判「指導」（shido）；這是柔道與桑搏、摔跤最大的不同之一。', 'Modern judo rules do not allow gripping, hooking or touching the opponent\'s legs with the hands — it is penalised with shido. This is one of the biggest differences from sambo and wrestling.') + '</p>' +
        '<h2>' + T('入門與安全', 'Starting out safely') + '</h2>' +
        '<ol><li>' + T('先學會受身（安全倒地），再學任何摔法。', 'Learn to breakfall before you learn any throw.') + '</li>' +
        '<li>' + T('摔法和關節技只在軟墊上、在教練指導下練習。', 'Practise throws and locks only on mats, with a coach.') + '</li>' +
        '<li>' + T('摔對方時拉住袖子，讓對方可以做好受身。', 'Keep hold of the sleeve when you throw so your partner can breakfall.') + '</li>' +
        '<li>' + T('關節技要慢慢施壓：對方一拍地或說「參った」，馬上放開；被鎖時早點拍地認輸。', 'Apply armlocks slowly and let go the moment your partner taps or says "maitta"; tap early yourself when caught.') + '</li></ol>' +
        '<p>' + T('相關課程：<a href="../sambo/">桑搏入門</a>、<a href="../mma/">MMA 入門</a>、<a href="../../self-defence/basics/">自我防衛基礎</a>。', 'Related: <a href="../sambo/">sambo basics</a>, <a href="../mma/">MMA basics</a> and <a href="../../self-defence/basics/">self-defence basics</a>.') + '</p>' +
        '<h2>' + T('常見問題', 'Frequently asked questions') + '</h2>' +
        '<details><summary>' + T('柔道和桑搏有什麼不同？', 'How is judo different from sambo?') + '</summary><p>' + T('兩者都穿外套摔人。柔道有勒頸，但禁止用手抓腿，關節技只能鎖手肘；運動桑搏允許抓腿和腿部關節技，但沒有勒頸。', 'Both throw in a jacket. Judo has chokes but bans grabbing the legs with the hands and allows locks on the elbow only; sport sambo allows leg grabs and leg locks but no chokes.') + '</p></details>' +
        '<details><summary>' + T('初學者應該先學什麼？', 'What should a beginner learn first?') + '</summary><p>' + T('禮儀、受身、自然體與組手，然後是出足掃、大外刈等基本摔法和袈裟固。', 'Etiquette, breakfalls, posture and grips, then basic throws such as the foot sweep and major outer reap, and the scarf hold-down.') + '</p></details>' +
        '<details><summary>' + T('腰帶顏色代表什麼？', 'What do the belt colours mean?') + '</summary><p>' + T('初學者繫白帶，隨著考級換成不同顏色（各國順序不同），黑帶代表達到段位，但在柔道裡黑帶被看作真正學習的開始。', 'Beginners wear a white belt and move through coloured belts as they grade (the order differs by country). A black belt marks the dan grades — in judo it is seen as the real start of learning.') + '</p></details>';
    }
  });
})(window);
</script>
