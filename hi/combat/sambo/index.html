<script>
(function (w) {
  'use strict';
  var L = w.SAMBO.LIST;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  w.KTLesson({
    list: L, prefix: 'sambo',
    makeClip: w.SAMBO.makeClip,
    info: function (s) { return { a: KT.name(s), b: KT.t(s.type).toUpperCase(), note: KT.t(s.note) }; },
    levelName: function (lv, T) { return T('目前速度：', 'Current speed: ') + (lv < 1 ? T('學習（慢動作）', 'Learning (slow motion)') : T('實戰速度', 'Fight speed')); },
    cardPre: function (s) { return KT.t(s.type); },
    cardSub: function (s, a) { return a.T('階段：', 'Phase: ') + KT.t(s.phase); },
    pre: function (s, a) { return a.T('第 {n} 個技術 · {type}', 'Technique {n} of 8 · {type}', { n: s.n, type: KT.t(s.type) }); },
    spec: [function (s) { return KT.t(s.contact); }, function (s) { return KT.t(s.phase); }, function (s) { return KT.t(s.ability); }],
    onRender: function (s) {
      document.getElementById('st-phase').textContent = KT.t(s.phase);
      document.getElementById('st-type').textContent = KT.t(s.type);
    },
    guide: function (a) {
      var T = a.T;
      var rows = L.map(function (s) {
        return '<tr><td>' + esc(KT.pick(s.zh, s.en)) + '</td><td>' + esc(KT.t(s.type)) + '</td><td>' + esc(KT.t(s.phase)) + '</td><td>' + esc(KT.t(s.contact)) + '</td></tr>';
      }).join('');
      return '<h2>' + T('什麼是桑搏？', 'What is sambo?') + '</h2>' +
        '<p>' + T('桑搏（Sambo）是 1920 至 1930 年代在蘇聯發展出來的格鬥術，名稱是俄文「不用武器的自衛」的縮寫。它吸收了柔道和多種民族摔跤的技術。選手穿外套（kurtka）、短褲和摔跤鞋，用摔、壓制和關節技取勝。',
          'Sambo is a martial art developed in the Soviet Union in the 1920s and 1930s; the name is a Russian short form of "self-defence without weapons". It draws on judo and many folk wrestling styles. Fighters wear a jacket (the kurtka), shorts and wrestling shoes, and win with throws, hold-downs and joint locks.') + '</p>' +
        '<h2>' + T('八課一覽', 'The eight lessons at a glance') + '</h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + T('技術', 'Technique') + '</th><th>' + T('類型', 'Type') + '</th><th>' + T('階段', 'Phase') + '</th><th>' + T('接觸點', 'Contact') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<h2>' + T('運動桑搏與格鬥桑搏', 'Sport sambo and combat sambo') + '</h2>' +
        '<p>' + T('運動桑搏是穿衣摔跤：可以摔、壓制、鎖手臂和腿部關節，但不允許勒頸。把對方摔到背部著地而自己保持站立，可以直接獲勝（稱為「完全勝利」）。格鬥桑搏再加上拳、踢、膝、肘和勒頸，原本是為軍隊與警察的自衛而設計，比賽時戴拳套和護具。',
          'Sport sambo is jacket wrestling: throws, hold-downs and arm and leg locks are allowed, but chokes are not. Throwing the opponent flat on their back while you stay standing wins the match outright (a "total victory"). Combat sambo adds punches, kicks, knees, elbows and chokes; it was built for military and police self-defence and is fought with gloves and protective gear.') + '</p>' +
        '<h2>' + T('入門與安全', 'Starting out safely') + '</h2>' +
        '<ol><li>' + T('先學會受身（安全倒地），再學任何摔法。', 'Learn to breakfall before you learn any throw.') + '</li>' +
        '<li>' + T('摔法和關節技只在軟墊上、在教練指導下練習。', 'Practise throws and locks only on mats, with a coach.') + '</li>' +
        '<li>' + T('腿鎖要慢慢施壓：對方一拍地或說「停」，馬上放開。', 'Apply leg locks slowly — let go the moment your partner taps or says stop.') + '</li>' +
        '<li>' + T('被鎖時早點拍地認輸，不要硬撐。', 'Tap early when you are caught in a lock — never fight through it.') + '</li></ol>' +
        '<p>' + T('相關課程：<a href="../mma/">MMA 入門</a>、<a href="../../self-defence/basics/">自我防衛基礎</a>。', 'Related: <a href="../mma/">MMA basics</a> and <a href="../../self-defence/basics/">self-defence basics</a>.') + '</p>' +
        '<h2>' + T('常見問題', 'Frequently asked questions') + '</h2>' +
        '<details><summary>' + T('桑搏和柔道有什麼不同？', 'How is sambo different from judo?') + '</summary><p>' + T('兩者都穿外套摔人，但桑搏允許直接抱腿和腿部關節技，柔道則有勒頸而現代規則禁止直接抱腿。', 'Both throw in a jacket, but sambo allows direct leg grabs and leg locks, while judo allows chokes and its modern rules ban grabbing the legs directly.') + '</p></details>' +
        '<details><summary>' + T('初學者應該先學什麼？', 'What should a beginner learn first?') + '</summary><p>' + T('受身、站姿與抓握，然後是簡單的掃腳和絆摔。', 'Breakfalls, the stance and grips, then simple foot sweeps and trips.') + '</p></details>' +
