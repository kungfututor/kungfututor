      <h1 data-zh="巴西柔術入門：防守、逃脫、掃倒、過腿與降伏 8 課" data-en="Brazilian Jiu-Jitsu Basics: Guard, Escapes, Sweeps, Passes and Submissions in 8 Lessons"></h1>
      <p class="hx-lede" data-zh="巴西柔術是以地面技術為主的格鬥術，靠位置與槓桿讓體型較小的人也能控制對手。這 8 課從封閉式防守和蝦式逃脫開始，學從下面逃脫和掃倒，再學過腿、騎乘位，最後是手臂鎖與裸絞。藍色道服是你，白色是夥伴，紅圈標示接觸點。" data-en="Brazilian Jiu-Jitsu is a grappling art built around fighting on the ground, using position and leverage so a smaller person can control a bigger one. These 8 lessons start with the closed guard and the shrimp, then escapes and a sweep from underneath, passing the guard and taking the mount, and finish with the armbar and the rear naked choke. Blue gi is you, white is your partner; the red ring marks the point of contact."></p>

<script>
(function (w) {
  'use strict';
  var L = w.BJJ.LIST;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  w.KTLesson({
    list: L, prefix: 'bjj',
    makeClip: w.BJJ.makeClip,
    info: function (s) { return { a: KT.name(s), b: KT.t(s.type).toUpperCase(), note: KT.t(s.note) }; },
    levelName: function (lv, T) { return T('目前速度：', 'Current speed: ') + (lv < 1 ? T('學習（慢動作）', 'Learning (slow motion)') : T('實戰速度', 'Fight speed')); },
    cardPre: function (s) { return KT.t(s.type); },
    cardSub: function (s, a) { return a.T('階段：', 'Phase: ') + KT.t(s.phase); },
    pre: function (s, a) { return a.T('第 {n} 個技術 · {type}', 'Technique {n} of 8 · {type}', { n: s.n, type: KT.t(s.type) }); },
    spec: [function (s) { return KT.t(s.contact); }, function (s) { return KT.t(s.phase); }, function (s) { return KT.t(s.ability); }],
    onRender: function (s) {
      document.getElementById('st-phase').textContent = KT.t(s.phase);
      document.getElementById('st-type').textContent = KT.t(s.type);
    },
    guide: function (a) {
      var T = a.T;
      var rows = L.map(function (s) {
        return '<tr><td>' + esc(KT.pick(s.zh, s.en)) + '</td><td>' + esc(KT.t(s.type)) + '</td><td>' + esc(KT.t(s.phase)) + '</td><td>' + esc(KT.t(s.contact)) + '</td></tr>';
      }).join('');
      return '<h2>' + T('什麼是巴西柔術？', 'What is Brazilian Jiu-Jitsu?') + '</h2>' +
        '<p>' + T('巴西柔術（BJJ）是從 20 世紀初傳到巴西的柔道與柔術發展出來的格鬥術與運動，最重要的推手是格雷西（Gracie）家族。它專注在地面：用正確的位置和槓桿，讓體型較小的人也能安全地控制、甚至讓較大的對手認輸。練習時通常穿道服（gi），也有不穿道服的 No-Gi 練法。', 'Brazilian Jiu-Jitsu (BJJ) is a martial art and sport that grew in Brazil from the judo and jujutsu taught there in the early twentieth century, developed above all by the Gracie family. It focuses on the ground: with the right position and leverage, a smaller person can stay safe, control a bigger opponent and even make them submit. It is usually trained in a jacket (the gi), and also without one (no-gi).') + '</p>' +
        '<h2>' + T('八課一覽', 'The eight lessons at a glance') + '</h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + T('技術', 'Technique') + '</th><th>' + T('類型', 'Type') + '</th><th>' + T('階段', 'Phase') + '</th><th>' + T('接觸點', 'Contact') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<h2>' + T('怎樣得分與獲勝', 'How scoring works') + '</h2>' +
        '<p>' + T('依國際巴西柔術聯盟（IBJJF）規則：摔倒、掃倒或膝壓腹各得 2 分，過腿得 3 分，騎乘位或背後控制得 4 分，位置通常要穩住約 3 秒才給分。差一點完成的動作會得到「優勢」，用來分出平手。不論比分多少，讓對方認輸都直接獲勝。不同賽事的規則略有不同，比賽前請查看該賽事的規則。', 'Under International Brazilian Jiu-Jitsu Federation (IBJJF) rules a takedown, sweep or knee on belly scores 2 points, passing the guard scores 3, and the mount or back control scores 4; a position usually has to be held for about 3 seconds to score. Near-misses earn "advantages", used to break ties. A submission wins outright, whatever the score. Rules differ a little between events, so check the rules of the one you enter.') + '</p>' +
        '<h2>' + T('入門與安全', 'Starting out safely') + '</h2>' +
        '<ol><li>' + T('先學會蝦式、挺腰和安全倒地，再學降伏。', 'Learn the shrimp, the bridge and how to fall safely before learning submissions.') + '</li>' +
        '<li>' + T('降伏技只在軟墊上、在教練指導下練習。', 'Practise submissions only on mats, with a coach.') + '</li>' +
        '<li>' + T('關節技和勒頸要慢慢施壓：對方一拍地或說「停」，馬上放開。', 'Apply locks and chokes slowly — let go the moment your partner taps or says stop.') + '</li>' +
        '<li>' + T('被鎖時早點拍地認輸，不要硬撐。', 'Tap early when you are caught — never fight through a lock or choke.') + '</li></ol>' +
        '<p>' + T('相關課程：<a href="../judo/">柔道入門</a>、<a href="../sambo/">桑搏入門</a>、<a href="../mma/">MMA 入門</a>。', 'Related: <a href="../judo/">judo basics</a>, <a href="../sambo/">sambo basics</a> and <a href="../mma/">MMA basics</a>.') + '</p>' +
        '<h2>' + T('常見問題', 'Frequently asked questions') + '</h2>' +
        '<details><summary>' + T('巴西柔術和柔道有什麼不同？', 'How is BJJ different from judo?') + '</summary><p>' + T('兩者同源。柔道比賽重視把對方摔倒，地面時間很短；巴西柔術則把大部分時間花在地面，發展出很多防守位、掃倒與降伏。', 'They share the same roots. Judo competition rewards throws and gives little time on the ground; BJJ spends most of its time on the ground and has developed many guards, sweeps and submissions.') + '</p></details>' +
        '<details><summary>' + T('初學者應該先學什麼？', 'What should a beginner learn first?') + '</summary><p>' + T('蝦式、挺腰、封閉式防守和從騎乘位、側壓逃脫——先學會保護自己，再學進攻。', 'The shrimp, the bridge, the closed guard and escapes from mount and side control — learn to stay safe before you learn to attack.') + '</p></details>' +
        '<details><summary>' + T('腰帶有哪些顏色？', 'What are the belt colours?') + '</summary><p>' + T('成人從白帶開始，依序是藍帶、紫帶、棕帶與黑帶；兒童另有中間的腰帶。升到黑帶通常需要很多年。', 'Adults start at white and go through blue, purple and brown to black; children have their own belts in between. Reaching black belt usually takes many years.') + '</p></details>';
    }
  });
})(window);
