<script>
(function () {
  'use strict';
  // hero: bow-stance alternating straight punch (gong bu chong quan)
  var STANCE = { x: 190, t: 6, h: -4, tu: 38, tl: -2, bu: -30, bl: -30 };
  var CHAMBER_N = { su: -28, sl: 78 }, CHAMBER_F = { fu: -28, fl: 78 };
  function m() { var o = {}; for (var i = 0; i < arguments.length; i++) for (var k in arguments[i]) o[k] = arguments[i][k]; return o; }
  var punch = {
    scale: 0.85, base: STANCE, ticks: false, labelAt: [340, 60],
    frames: [
      { d: 380, p: m(CHAMBER_N, CHAMBER_F) },
      { d: 160, p: m({ su: 88, sl: 90, t: 10 }, CHAMBER_F), e: 'out' },
      { d: 300, p: m({ su: 88, sl: 90, t: 10 }, CHAMBER_F) },
      { d: 160, p: m(CHAMBER_N, { fu: 88, fl: 90, t: 10 }), e: 'out' },
      { d: 300, p: m(CHAMBER_N, { fu: 88, fl: 90, t: 10 }) }
    ],
    props: function (J, c) {
      var S = c.S;
      return { front: S.circle(J.hN, 5.5, '#A84E37') + S.circle(J.hF, 5, '#8F95A3') };
    }
  };
  var hero = new KTFigure.Player(document.getElementById('hero-fig'));
  hero.load(punch); hero.setSpeed(0.75); hero.setInfo({ b: '' });

  // real totals from the cards
  var live = document.querySelectorAll('.card[data-n]'), sum = 0;
  [].forEach.call(live, function (c) { sum += +c.getAttribute('data-n'); });
  document.getElementById('n-topics').textContent = live.length;
  document.getElementById('n-lessons').textContent = sum;
  function counts() {
    [].forEach.call(document.querySelectorAll('[data-pillar]'), function (sec) {
      var cs = sec.querySelectorAll('.card[data-n]'), n = 0;
      [].forEach.call(cs, function (c) { n += +c.getAttribute('data-n'); });
      sec.querySelector('[data-count]').textContent = KT.fmt(KT.pick('{a} 個項目 · {b} 課', '{a} topics · {b} lessons'), { a: cs.length, b: n });
    });
  }
  KT.onLang(counts);

  // filter pills
  var pills = document.querySelectorAll('.pills button');
  [].forEach.call(pills, function (b) {
    b.addEventListener('click', function () {
      var want = b.getAttribute('data-show');
      [].forEach.call(pills, function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
      [].forEach.call(document.querySelectorAll('[data-pillar]'), function (sec) { sec.hidden = want !== 'all' && sec.id !== want; });
      var first = want === 'all' ? document.getElementById('kungfu') : document.getElementById(want);
      if (first) first.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });
})();
</script>
