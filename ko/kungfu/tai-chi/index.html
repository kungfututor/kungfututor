<script>
(function (w, d) {
  'use strict';
  var TC = w.TAICHI, L = TC.LIST;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var api = w.KTLesson({
    list: L, prefix: 'tc',
    makeClip: TC.makeClip,
    info: function (s, lang) { return { a: s.zh, b: s.py.toUpperCase(), note: KT.t(s.key) }; },
    levelName: function (lv, T) { return T('目前速度：', 'Current pace: ') + (lv < 1 ? T('初學慢速', 'Beginner (slower)') : T('標準', 'Standard')); },
    cardPre: function (s, a) { return KT.t(TC.GROUPS[s.g]); },
    cardSub: function (s) { return s.py; },
    pre: function (s, a) { return a.T('第 {n} 式 · {group} · 拼音 {py}', 'Posture {n} of 24 · {group} · Pinyin {py}', { n: s.n, group: KT.t(TC.GROUPS[s.g]), py: s.py }); },
    spec: [function (s, l) { return KT.t(TC.TYPE_NAME[s.type]); }, function (s, l) { return KT.t(TC.GROUPS[s.g]); }, function (s, l) { return KT.t(s.key); }],
    onRender: function (s, a) {
      d.getElementById('st-cur').textContent = (s.n < 10 ? '0' : '') + s.n + ' ' + (KT.pick(s.zh, s.en));
      d.getElementById('st-grp').textContent = KT.t(TC.GROUPS[s.g]) + ' · ' + KT.t(TC.TYPE_NAME[s.type]);
    },
    guide: function (a) {
      var T = a.T, l = a.st.lang;
      var rows = L.map(function (s) {
        return '<tr><td>' + s.n + '</td><td>' + esc(s.zh) + '</td><td>' + esc(s.py) + '</td><td>' + esc(s.en) + '</td><td>' + esc(KT.t(TC.GROUPS[s.g])) + '</td></tr>';
      }).join('');
      return '<h2>' + T('24 式太極拳的由來', 'Where the 24-form comes from') + '</h2>' +
        '<p>' + T('1956 年，中國國家體育運動委員會以傳統楊式太極拳為基礎，刪去重複動作、整理出由簡到難的 24 個動作，稱為「簡化太極拳」。因為容易學、時間短，它成為全世界最普及的太極拳套路，也是許多比賽與晨練的標準套路。',
          'In 1956 China\'s national sports commission took traditional Yang-style Tai Chi, removed the repetitions and arranged 24 postures from simple to harder — the "simplified Tai Chi" form. Because it is short and easy to start, it became the most widely practised Tai Chi routine in the world and a standard for competitions and morning practice in parks.') + '</p>' +
        '<h2>' + T('全部 24 式一覽', 'All 24 postures') + '</h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>' + T('名稱', 'Name') + '</th><th>' + T('拼音', 'Pinyin') + '</th><th>English</th><th>' + T('組別', 'Group') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<p class="note">' + T('英文名稱有多種常見譯法，此處採用常見版本。', 'English names vary between books and teachers; these are common versions.') + '</p>' +
        '<h2>' + T('練習要領', 'How to practise') + '</h2>' +
        '<ol><li>' + T('一次學一組（3–4 式），熟練後再接下一組。', 'Learn one group (3–4 postures) at a time before adding the next.') + '</li>' +
        '<li>' + T('動作慢而均勻，速度從頭到尾保持一致。', 'Move slowly and evenly, keeping the same pace throughout.') + '</li>' +
        '<li>' + T('呼吸自然：一般開、起、收時吸氣，合、落、推時呼氣；不要憋氣。', 'Breathe naturally — usually in as you open, rise or draw in, out as you close, sink or push. Never hold your breath.') + '</li>' +
        '<li>' + T('膝蓋對準腳尖，重心轉移完成後再移動另一腳。', 'Keep the knees in line with the toes, and only move a foot after the weight has fully shifted off it.') + '</li></ol>' +
        '<h2>' + T('太極拳對健康的好處', 'Health benefits') + '</h2>' +
        '<p>' + T('多項研究整理顯示，太極拳可能有助於改善長者的平衡、降低跌倒風險，並對柔軟度、心情與睡眠有幫助。它屬於低至中強度運動，適合大多數年齡層；如有心血管、關節或平衡方面的問題，請先諮詢醫師。',
          'Research reviews suggest Tai Chi may help older adults improve balance and lower their risk of falls, and may help flexibility, mood and sleep. It is low-to-moderate intensity and suits most ages; if you have heart, joint or balance problems, check with your doctor first.') + '</p>' +
        '<p>' + T('想先打好下盤基礎？可以看 <a href="../stances/">功夫五大步型</a>，弓步、虛步、仆步都會在 24 式中用到。', 'Want stronger foundations first? See <a href="../stances/">the five basic stances</a> — bow, empty and drop stance all appear in the 24-form.') + '</p>' +
        '<h2>' + T('常見問題', 'Frequently asked questions') + '</h2>' +
        '<details><summary>' + T('打完 24 式需要多久？', 'How long does the whole form take?') + '</summary><p>' + T('一般約 4–6 分鐘，慢練可以更長。', 'Usually about 4–6 minutes; slower practice can take longer.') + '</p></details>' +
        '<details><summary>' + T('學會 24 式需要多久？', 'How long does it take to learn?') + '</summary><p>' + T('規律練習的話，很多人幾週到幾個月可以記住順序；動作要練得純熟需要更長時間。', 'With regular practice many people learn the order in a few weeks to a few months; polishing it takes much longer.') + '</p></details>' +
        '<details><summary>' + T('為什麼有些動作有「左右」兩式？', 'Why do some postures have left and right versions?') + '</summary><p>' + T('野馬分鬃、摟膝拗步、倒捲肱、雲手、穿梭等動作會左右交替重複。動畫顯示一側，請用「左式／右式」按鈕看另一側。', 'Postures such as Wild Horse\'s Mane, Brush Knee, Repulse Monkey, Cloud Hands and the Shuttles repeat on alternate sides. The animation shows one side — use the Left/Right button for the other.') + '</p></details>' +
        '<details><summary>' + T('這些動畫可以取代老師嗎？', 'Can these animations replace a teacher?') + '</summary><p>' + T('不能。動畫是簡化的平面示意，方便記憶順序與要點；轉身方向、細部手形與勁力仍建議跟合格老師學習。', 'No. They are simplified flat illustrations to help you remember the order and key points; turning directions, hand details and internal energy are best learned from a qualified teacher.') + '</p></details>';
    }
  });

  // play the whole form: when a posture's clip finishes, go to the next one
  var auto = false, startCycle = 0, autoBtn = d.getElementById('auto');
  function setAuto(on) {
    auto = on; autoBtn.setAttribute('aria-pressed', String(on));
    if (on) { api.player.toggle(true); startCycle = Math.floor(api.player.elapsed / api.player.total); }
  }
  autoBtn.addEventListener('click', function () { setAuto(!auto); });
  (function watch() {
    var p = api.player;
    if (auto && p.playing && p.total && Math.floor(p.elapsed / p.total) > startCycle) {
      var next = (api.st.idx + 1) % L.length;
      if (next === 0) { setAuto(false); }
      else { api.select(next); api.player.toggle(true); startCycle = 0; api.player.elapsed = 0; }
    }
    w.requestAnimationFrame(watch);
  })();
})(window, document);
</script>
