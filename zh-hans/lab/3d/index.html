<style>
  .lab-hero { position: relative; overflow: hidden; padding: 36px 0 12px; }
  .lab-hero .glow.a { top: -160px; left: 50%; width: 900px; height: 380px; margin-left: -450px; background: radial-gradient(closest-side, rgba(205, 233, 220, .8), transparent); }
  .lab-hero .wrap { position: relative; z-index: 1; }
  .lab-hero .crumb { font: 600 13px var(--f-ui); color: var(--muted); }
  .lab-hero .crumb a { color: var(--sage); text-decoration: none; }
  .lab-hero h1 { font: 400 clamp(32px, 5vw, 52px)/1.12 var(--f-serif); letter-spacing: -.02em; margin: 14px 0 12px; }
  .lab-hero h1 em { color: var(--sage); }
  .lab-hero p { color: var(--ink-2); max-width: 680px; margin: 0; font-size: 17px; line-height: 1.7; }
  .lab { display: grid; grid-template-columns: 1fr 300px; gap: 22px; margin-top: 26px; align-items: start; }
  .viewer { background: var(--card); border-radius: 24px; box-shadow: var(--sh-1); padding: 14px; }
  #lab-stage { position: relative; height: min(64vh, 600px); min-height: 340px; border-radius: 16px; overflow: hidden; background: #F4EFE6; touch-action: none; }
  #lab-stage canvas { display: block; width: 100% !important; height: 100% !important; cursor: grab; }
  #lab-stage canvas:active { cursor: grabbing; }
  .lab-hud { position: absolute; left: 12px; right: 12px; top: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: rgba(254, 249, 240, .86); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, .6); box-shadow: var(--sh-1); pointer-events: none; }
  .lab-hud small { display: block; font: 700 11px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--terra); }
  .lab-hud b { display: block; font: 500 20px/1.2 var(--f-serif); }
  .lab-hud .hint { font: 600 12px var(--f-ui); color: var(--muted); text-align: end; }
  .lab-step { margin: 12px 4px 4px; min-height: 2.6em; font: 600 14px/1.5 var(--f-ui); color: var(--ink); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .bar .grp { display: flex; flex-wrap: wrap; gap: 4px; background: var(--bg-mid); border-radius: 20px; padding: 4px; }
  .bar button { white-space: nowrap; }
  .bar button { border: 0; cursor: pointer; padding: 8px 13px; border-radius: 999px; font: 600 13px var(--f-ui); background: transparent; color: var(--ink-2); }
  .bar button:hover { background: var(--bg-high); }
  .bar button[aria-pressed="true"] { background: var(--sage); color: #fff; }
  .bar .main { background: var(--sage); color: #fff; padding: 9px 18px; }
  .bar .main:hover { background: var(--sage-2); }
  .bar .soft { background: var(--bg-mid); }
  .scrub { display: flex; align-items: center; gap: 12px; margin-top: 12px; font: 600 12px var(--f-ui); color: var(--muted); }
  .scrub input { flex: 1; accent-color: #365749; }
  .moves h2 { font: 500 22px var(--f-serif); margin: 4px 0 12px; }
  .lab-cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .lab-cats button { border: 0; cursor: pointer; padding: 7px 12px; border-radius: 999px; font: 600 12px var(--f-ui); background: var(--bg-mid); color: var(--ink-2); white-space: nowrap; }
  .lab-cats button[aria-pressed="true"] { background: var(--terra); color: #fff; }
  #lab-moves { display: grid; gap: 8px; max-height: 560px; overflow-y: auto; padding: 2px 6px 8px 2px; }
  #lab-moves button[hidden] { display: none; }
  #lab-moves button { text-align: start; border: 0; cursor: pointer; background: var(--card); border-radius: 16px; padding: 12px 14px; box-shadow: var(--sh-1); font: 600 15px var(--f-ui); color: var(--ink); }
  #lab-moves button small { display: block; font: 700 10px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--terra); margin-bottom: 2px; }
  #lab-moves button:hover { box-shadow: var(--sh-2); }
  #lab-moves button[aria-pressed="true"] { background: var(--sage); color: #fff; }
  #lab-moves button[aria-pressed="true"] small { color: #CDE9DC; }
  .moves .more { display: inline-block; margin-top: 14px; font: 700 13px var(--f-ui); color: var(--sage); text-decoration: none; }
  .moves .more:hover { text-decoration: underline; }
  .lab-note { margin-top: 26px; background: var(--bg-low); border-radius: 20px; padding: 20px 22px; color: var(--ink-2); font-size: 14px; line-height: 1.7; }
  .lab-note h2 { margin: 0 0 6px; font: 500 20px var(--f-serif); color: var(--ink); }
  .lab-note ul { margin: 6px 0 0; padding-inline-start: 20px; }
  .lab-fail { padding: 40px 20px; text-align: center; color: var(--ink-2); }
  @media (max-width: 980px) { .lab { grid-template-columns: 1fr; } #lab-moves { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); max-height: none; } }
  @media (max-width: 640px) { #lab-stage { height: 56vh; min-height: 300px; } .lab-hud .hint { display: none; } .viewer { padding: 10px; border-radius: 20px; } }
</style>

  <section class="lab-hero">

      <h1><span data-zh="3D 動作實驗室：" data-en="3D Movement Lab:"></span> <em data-zh="從每個角度看清楚" data-en="see every angle"></em></h1>
      <p data-zh="拖動畫面把教練轉一圈，從正面、背面、側面或上方看動作；放慢到 0.25 倍，或拉動進度條一格一格看。動作來自我們的課程動畫。" data-en="Drag to turn the instructor all the way round and watch from the front, back, side or above; slow it to a quarter speed, or pull the slider to step through it frame by frame. The moves come from our lesson animations."></p>

          </div>
        </div>
        <div class="bar">
          <div class="grp" role="group" aria-label="View">
            <button type="button" data-view="front" data-zh="正面" data-en="Front"></button>
            <button type="button" data-view="back" data-zh="背面" data-en="Back"></button>

      <aside class="moves">

        <a class="more" id="lab-link" href="../../"><span data-zh="打開完整課程：要領、錯誤與練習 →" data-en="Open the full lesson: cues, mistakes and drills →"></span></a>
      </aside>
    </div>

    <div class="lab-note">
      <h2 data-zh="關於這個 3D 教練" data-en="About this 3D instructor"></h2>
      <p data-zh="3D 教練跟著我們側面課程的關鍵動作移動，所以主要的動作在身體側面的平面上；像泰拳中段踢這類需要轉髖的動作，在 3D 中是簡化的。學習時請同時閱讀完整課程，並盡可能在合格教練指導下練習。" data-en="The 3D instructor follows the key positions of our side-view lessons, so most of the movement happens in the side plane; moves that turn the hips, such as the Muay Thai roundhouse, are simplified in 3D. Read the full lesson as well, and practise under a qualified coach where possible."></p>
