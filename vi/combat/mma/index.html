<script>
(function (w) {
  'use strict';
  var L = w.MMA.LIST;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  w.KTLesson({
    list: L, prefix: 'mma',
    makeClip: w.MMA.makeClip,
    info: function (s) { return { a: KT.name(s), b: KT.t(s.type).toUpperCase(), note: KT.t(s.note) }; },
    levelName: function (lv, T) { return T('目前速度：', 'Current speed: ') + (lv < 1 ? T('學習（慢動作）', 'Learning (slow motion)') : T('實戰速度', 'Fight speed')); },
    cardPre: function (s) { return KT.t(s.type); },
    cardSub: function (s, a) { return a.T('階段：', 'Phase: ') + KT.t(s.phase); },
    pre: function (s, a) { return a.T('第 {n} 個技術 · {type}', 'Technique {n} of 8 · {type}', { n: s.n, type: KT.t(s.type) }); },
    spec: [function (s) { return KT.t(s.contact); }, function (s) { return KT.t(s.phase); }, function (s) { return KT.t(s.ability); }],
    onRender: function (s) {
      document.getElementById('st-phase').textContent = KT.t(s.phase);
      document.getElementById('st-type').textContent = KT.t(s.type);
    },
    guide: function (a) {
      var T = a.T;
      var rows = L.map(function (s) {
        return '<tr><td>' + esc(KT.pick(s.zh, s.en)) + '</td><td>' + esc(KT.t(s.type)) + '</td><td>' + esc(KT.t(s.phase)) + '</td><td>' + esc(KT.t(s.contact)) + '</td></tr>';
      }).join('');
      return '<h2>' + T('什麼是 MMA？', 'What is MMA?') + '</h2>' +
        '<p>' + T('綜合格鬥（MMA）是允許站立打擊、纏抱、摔與地面技術的格鬥運動，選手通常結合拳擊、泰拳、摔跤和巴西柔術。比賽在八角籠或擂台中進行，可以用擊倒、降伏（讓對方拍地認輸）或裁判判定獲勝。',
          'Mixed martial arts (MMA) is a combat sport that allows striking, clinching, takedowns and ground fighting; fighters usually blend boxing, Muay Thai, wrestling and Brazilian jiu-jitsu. Bouts take place in a cage or ring and are won by knockout, submission (the opponent taps out) or the judges\' decision.') + '</p>' +
        '<h2>' + T('八個技術一覽', 'The eight techniques at a glance') + '</h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + T('技術', 'Technique') + '</th><th>' + T('類型', 'Type') + '</th><th>' + T('階段', 'Phase') + '</th><th>' + T('接觸點', 'Contact') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<h2>' + T('打擊和摔怎麼連在一起？', 'How do striking and wrestling connect?') + '</h2>' +
        '<p>' + T('MMA 最大的特色是「打擊掩護摔、摔逼出打擊」：對方抬手護頭時，雙腿抱摔更容易成功；對方怕被摔而壓低重心時，過頂拳和膝擊更容易打中。所以站架要能同時應付兩種威脅。',
          'MMA\'s key idea is that strikes set up takedowns and the threat of takedowns sets up strikes: when they raise their hands to block punches, the double-leg gets easier; when they drop low to stop takedowns, the overhand and knees land more easily. That is why the stance must handle both threats at once.') + '</p>' +
        '<h2>' + T('入門與安全', 'Starting out safely') + '</h2>' +
        '<ol><li>' + T('先分別學好拳擊站架、基本摔與受身（安全倒地）。', 'Learn a boxing stance, basic wrestling and how to fall safely (breakfalls) first.') + '</li>' +
        '<li>' + T('摔與地面技術只在軟墊上、在教練指導下練習。', 'Practise takedowns and ground work only on mats, with a coach.') + '</li>' +
        '<li>' + T('對打時戴 MMA 手套或拳套、護齒，初期以技術對打為主。', 'Spar with MMA or boxing gloves and a mouthguard, starting with light technical sparring.') + '</li>' +
        '<li>' + T('被勒或關節被鎖時，早點拍地認輸，不要硬撐。', 'Tap early when caught in a choke or joint lock — never fight through it.') + '</li></ol>' +
        '<p>' + T('相關課程：<a href="../boxing/">拳擊入門</a>、<a href="../muay-thai/">泰拳入門</a>。', 'Related: <a href="../boxing/">boxing basics</a> and <a href="../muay-thai/">Muay Thai basics</a>.') + '</p>' +
        '<h2>' + T('常見問題', 'Frequently asked questions') + '</h2>' +
        '<details><summary>' + T('MMA 初學者應該先學什麼？', 'What should an MMA beginner learn first?') + '</summary><p>' + T('站架、基本拳、防摔下壓和安全起身。這些能讓你在對打中保護自己。', 'The stance, basic punches, the sprawl and getting up safely — they keep you safe in sparring.') + '</p></details>' +
        '<details><summary>' + T('什麼是下壓（Sprawl）？', 'What is a sprawl?') + '</summary><p>' + T('對方抱腿時把雙腳往後甩、髖部壓在對方背上的防摔動作。', 'A takedown defence: throw your legs back and drop your hips onto their back as they shoot.') + '</p></details>' +
        '<details><summary>' + T('沒有摔跤背景可以學 MMA 嗎？', 'Can I learn MMA without a wrestling background?') + '</summary><p>' + T('可以。大部分 MMA 課程會從最基本的站架、受身和摔開始教。', 'Yes — most MMA classes teach the stance, breakfalls and basic takedowns from scratch.') + '</p></details>';
    }
  });
})(window);
</script>
