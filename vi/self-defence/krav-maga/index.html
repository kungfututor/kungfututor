      <h1 data-zh="以色列格鬥術（Krav Maga）入門：防守、反擊、離開" data-en="Krav Maga Basics: Defend, Counter, Get Away"></h1>
      <p class="hx-lede" data-zh="Krav Maga 是以色列發展的防身系統，重點是簡單、自然的動作：防守與反擊同時進行，反擊時連續不停，最後安全離開。灰色人形代表攻擊者，紅圈標示反擊的位置。" data-en="Krav Maga is a self-defence system developed in Israel built on simple, natural movements: defend and counter at the same time, keep going once you fight back, and finish by getting away safely. The grey figure is the attacker; the red ring marks where your counter lands."></p>
    </div>

  <aside class="safety" role="note"><b data-zh="安全提醒：" data-en="Safety: "></b><span data-zh="能避開就避開、能離開就離開。只在無法離開時使用合理、必要的力量保護自己，安全後立刻停止並報警。各地法律不同。練習時只打手靶或護具，絕對不要真的打、掐或踢同伴；請在合格教練指導下訓練。" data-en="If you can avoid it or leave, do. Use only reasonable, necessary force when you cannot get away, and stop and call the police as soon as you are safe. Laws differ from place to place. In training, strike only pads or protective gear — never really hit, choke or kick your partner — and train under a qualified instructor."></span></aside>

<script>
(function (w) {
  'use strict';
  var L = w.KRAV.LIST;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  w.KTLesson({
    list: L, prefix: 'kv',
    makeClip: w.KRAV.makeClip,
    info: function (s) { return { a: KT.name(s), b: KT.t(s.type).toUpperCase(), note: KT.t(s.note) }; },
    levelName: function (lv, T) { return T('目前速度：', 'Current pace: ') + (lv < 1 ? T('學習（慢動作）', 'Learning (slow motion)') : T('實際速度', 'Real speed')); },
    cardPre: function (s) { return KT.t(s.type); },
    cardSub: function (s, a) { return a.T('時機：', 'When: ') + KT.t(s.when); },
    pre: function (s, a) { return a.T('第 {n} 個動作 · {type}', 'Move {n} of 8 · {type}', { n: s.n, type: KT.t(s.type) }); },
    spec: [function (s) { return KT.t(s.target); }, function (s) { return KT.t(s.when); }, function (s) { return KT.t(s.ability); }],
    onRender: function (s) {
      document.getElementById('st-when').textContent = KT.t(s.when);
      document.getElementById('st-type').textContent = KT.t(s.type);
    },
    guide: function (a) {
      var T = a.T;
      var rows = L.map(function (s) {
        return '<tr><td>' + esc(KT.pick(s.zh, s.en)) + '</td><td>' + esc(KT.t(s.type)) + '</td><td>' + esc(KT.t(s.when)) + '</td><td>' + esc(KT.t(s.target)) + '</td></tr>';
      }).join('');
      return '<h2>' + T('什麼是 Krav Maga？', 'What is Krav Maga?') + '</h2>' +
        '<p>' + T('Krav Maga（希伯來文意思是「近身格鬥」）是在以色列發展起來的自我防衛系統，結合拳擊、摔跤等格鬥技的實用動作。它沒有比賽規則，訓練重點是真實情況：快速反應、利用身體自然的反射、防守和反擊同時進行，最後安全離開。',
          'Krav Maga (Hebrew for "close combat") is a self-defence system developed in Israel that borrows practical movements from boxing, wrestling and other fighting arts. It has no competition rules: training focuses on real situations — reacting fast, using the body\'s natural reflexes, defending and countering together, and getting away safely.') + '</p>' +
        '<h2>' + T('三個核心原則', 'Three core principles') + '</h2>' +
        '<ol><li><b>' + T('同時防守與反擊：', 'Defend and counter together: ') + '</b>' + T('不要先擋完再打，兩者同時進行，縮短被動的時間。', 'Don\'t block and then hit — do both at once to spend less time on the back foot.') + '</li>' +
        '<li><b>' + T('連續攻擊（Retzev）：', 'Continuous motion (retzev): ') + '</b>' + T('一旦必須反擊，就不停頓，直到能夠離開。', 'Once you must fight back, keep going without pausing until you can escape.') + '</li>' +
        '<li><b>' + T('觀察與離開：', 'Scan and leave: ') + '</b>' + T('目標是安全回家，不是打贏。每個動作都以觀察四周、離開現場結束。', 'The goal is getting home safe, not winning. Every move ends with scanning and leaving.') + '</li></ol>' +
        '<h2>' + T('八個動作一覽', 'The eight moves at a glance') + '</h2>' +
        '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>' + T('動作', 'Move') + '</th><th>' + T('類型', 'Type') + '</th><th>' + T('使用時機', 'When') + '</th><th>' + T('目標', 'Target') + '</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
        '<h2>' + T('安全練習', 'Practise safely') + '</h2>' +
        '<ol><li>' + T('擊打只打手靶、踢靶或護具。', 'Strike only pads, shields or protective gear.') + '</li>' +
        '<li>' + T('掐喉、抓握練習時，夥伴只是輕輕放上手，不要真的用力。', 'In choke and grab drills, the partner rests their hands lightly — no real squeezing.') + '</li>' +
        '<li>' + T('每一次練習都以「後退、觀察、離開」結束。', 'End every drill by backing off, scanning and leaving.') + '</li>' +
        '<li>' + T('想更進一步，請報名有合格教練的 Krav Maga 課程。', 'To go further, join a Krav Maga class with a qualified instructor.') + '</li></ol>' +
        '<p>' + T('也可以先看 <a href="../basics/">基本防身術 8 招</a>，學習戒備姿勢與保持距離。', 'You can also start with <a href="../basics/">self-defence basics</a> for the fence and keeping your distance.') + '</p>' +
        '<h2>' + T('常見問題', 'Frequently asked questions') + '</h2>' +
        '<details><summary>' + T('Krav Maga 和一般武術有什麼不同？', 'How is Krav Maga different from other martial arts?') + '</summary><p>' + T('它沒有比賽和套路，只專注在真實的自我防衛情況，動作簡單，強調盡快脫身。', 'It has no competitions or forms — only real self-defence situations, simple movements and getting out fast.') + '</p></details>' +
        '<details><summary>' + T('被正面掐住脖子怎麼辦？', 'What do I do if I\'m choked from the front?') + '</summary><p>' + T('雙手立刻舉起勾住對方的拇指，往下往外拉開，下巴收緊，接著反擊並離開。', 'Bring both hands up, hook the thumbs and pluck down and out with your chin tucked, then counter and get away.') + '</p></details>' +
        '<details><summary>' + T('體型小的人也有用嗎？', 'Does it work for smaller people?') + '</summary><p>' + T('Krav Maga 的動作設計就是不靠蠻力：利用弱點、時機與連續反擊。不過沒有任何方法保證成功，離開永遠是第一選擇。', 'Krav Maga is designed not to rely on strength — it uses weak points, timing and continuous counters. Still, nothing is guaranteed; leaving is always the first choice.') + '</p></details>';
    }
  });
})(window);
</script>
